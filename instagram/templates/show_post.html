{% extends 'base.html' %}
{% load static %}
<!-- instagram/templates/show_post.html
 show_post.html extends base.html and displays a single Post, showing its
 caption, timestamp, and all associated Photos in a grid. -->
{% block content %}
<div class="post-detail">
    <p class="post-meta">
        <strong>@{{ post.profile.username }}</strong>
        <span>{{ post.timestamp|date:"F j, Y, g:i a" }}</span>
    </p>
    <p class="post-caption">{{ post.caption }}</p>

    <div class="post-photo-grid">
        {% for photo in post.get_photos %}
            <img src="{% static photo.image_url %}" alt="" style="width: 450px; height: 450px; object-fit: cover;">
        {% empty %}
            <p>No photos for this post.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
