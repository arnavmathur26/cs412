{% extends 'quote/base.html' %}
{% load static %}

{% block content %}

    <h2>All Quotes</h2>
    <ul>
    {% for q in quotes %}
        <li>"{{ q }}"</li>
    {% endfor %}
    </ul>

    <h2>All Images</h2>
    {% for img in images %}
        <img src="{% static img %}" alt="Tom Brady" width="1000">
    {% endfor %}

{% endblock %}
