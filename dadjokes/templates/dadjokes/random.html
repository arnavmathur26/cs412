{% extends 'dadjokes/base.html' %}
{% load static %}

{% block content %}

    <div class="card">
    {% if joke %}
        <p class="joke-text">"{{ joke.joke }}"</p>
        <p class="contributor">&mdash; {{ joke.contributor }}</p>
    {% else %}
        <p class="empty">No jokes yet.</p>
    {% endif %}
    </div>

    <div class="card">
    {% if picture %}
        <img src="{% static picture.image_url %}" alt="Dad joke picture">
        <p class="contributor">Contributed by {{ picture.contributor }}</p>
    {% else %}
        <p class="empty">No pictures yet.</p>
    {% endif %}
    </div>

{% endblock %}
